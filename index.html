const Excel=(()=>{
  const dec=new TextDecoder('utf-8'),enc=new TextEncoder();
  const u16=(dv,p)=>dv.getUint16(p,true),u32=(dv,p)=>dv.getUint32(p,true);

  function xmlSheet(rows,cols){let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><cols>';
    for(let i=0;i<cols;i++){let wid=[22,26,25,35,51,24,18,20,20][i]||18;xml+=`<col min="${i+1}" max="${i+1}" width="${wid}" customWidth="1"/>`;}

  const s=txt(v),m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[3]}`;

function layout(content){const section=PAGES.find(x=>x[0]===page)?.[2]||'Painel';return `<div class="app"><aside class="side"><div class="logo"><span class="logo-icon">↗</span><span>money<b>tracker</b></span></div><div class="side-title">Investimentos</div><nav class="nav">${PAGES.map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'active':''}"><span class="nav-icon">${x[1]}</span>${x[2]}</button>`).join('')}</nav><div class="sidefoot"><strong>Fonte dos dados: arquivos B3</strong>Uso pessoal, sem conexão a corretoras. Acesso pela sua conta; histórico e posições sincronizados com o Supabase.</div></aside><main class="workspace"><header class="top"><div><div class="eyebrow">MoneyTracker / ${section}</div><h1>${section}</h1></div><div class="actions"><span class="chip desktop-only">Conta sincronizada</span><button class="btn outline" data-act="open-import">⇧ Importar</button><button class="btn" data-act="add-trade">＋ Lançamento</button></div></header>${content}</main></div><nav class="footnav">${[['home','⌂','Início'],['portfolio','▤','Carteira'],['ai','✦','Análise'],['records','≡','Registros'],['files','⇅','B3']].map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'active':''}"><span class="nav-icon">${x[1]}</span>${x[2]}</button>`).join('')}</nav>`;}

function portfolio(D){const list=D.holdings.filter(r=>!ui.portfolioFilter||r.cat===ui.portfolioFilter);return `<div class="stack">${caution()}${coverageFlag()}<div class="grid g3">${metric(D.reported?'Valor atualizado (B3)':'Custo remanescente aproximado',money(D.total),D.reported?'Posição em '+D.reported.date.split('-').reverse().join('/'):'Sem atualização de cotações')}${metric(D.reported?'Posições informadas':'Ativos com saldo',nfmt(D.active.length,0),D.reported?'Conforme arquivo B3':'Estimadas por negociações','▤')}${metric('Vendas sem histórico de compra',nfmt(D.unmatched,5),'Unidades cuja origem não consta','⚠')}</div>${box(`<div class="section"><h2>Ativos identificados</h2><div class="row"><button data-act="add-trade" class="btn small">＋ Negociação</button></div></div><div class="filterline" style="margin-bottom:15px"><select class="input" id="pf" style="max-width:260px"><option value="">Todas as classes</option>${CATS.map(x=>`<option value="${x.id}" ${ui.portfolioFilter===x.id?'selected':''}>${x.n}</option>`).join('')}</select></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Ativo</th><th>Classe (editável)</th><th class="num">${D.reported?'Quantidade B3':'Quantidade estimada'}</th><th class="num">${D.reported?'Preço atualizado/unidade':'Preço médio aprox.'}</th><th class="num">${D.reported?'Valor atualizado B3':'Custo remanescente aprox.'}</th></tr></thead><tbody>${list.slice(0,140).map(r=>`<tr><td><b>${h(r.code)}</b>${r.unmatched?`<div class="fine dangertext">Venda sem compra anterior: ${nfmt(r.unmatched,5)} un.</div>`:''}</td><td><select data-class="${h(r.code)}" style="max-width:160px" class="input">${CATS.map(c=>`<option value="${c.id}" ${r.cat===c.id?'selected':''}>${c.n}</option>`).join('')}</select></td><td class="num">${nfmt(r.qty,6)}</td><td class="num">${money(r.pm,5)}</td><td class="num">${money(r.cost)}</td></tr>`).join('')}</tbody></table></div><p class="help">${D.reported?"Os preços e valores são do último Excel de Posição importado; para atualizar, importe um novo relatório B3. Tesouro Direto mostra valor bruto atualizado, não valor líquido.":"Preço médio estimado pelo histórico, sujeito a lacunas e eventos societários."}</p>`)} </div>`;}
function strategy(D){const sum=Object.values(S.targets).reduce((a,b)=>a+Number(b||0),0);return `<div class="stack">${caution()}<div class="grid wide">${box(`<div class="section"><h2>Distribuição-alvo da carteira</h2><span class="chip ${Math.abs(sum-100)>.001?'amber':''}">Soma ${nfmt(sum,1)}%</span></div><p class="small muted">Personalize sua meta. A alocação atual usa o último relatório de Posição B3 quando disponível; do contrário, apenas o custo histórico aproximado.</p><form id="target-form" class="stack" style="gap:13px">${CATS.map(c=>{const actual=D.total?D.cats[c.id]/D.total*100:0,tgt=S.targets[c.id]||0;return `<div class="vizrow"><b>${c.n}</b><div><div class="bar"><div style="background:${c.c};width:${Math.min(100,actual)}%"></div></div><div style="margin-top:5px" class="bar"><div style="background:#aebdc1;width:${Math.min(100,tgt)}%"></div></div></div><div class="pct">${pcent(actual)}</div><input aria-label="Meta para ${c.n}" style="width:51px;text-align:right;padding:5px 2px;border:1px solid #dfe9e8;border-radius:6px;font-size:11px" name="${c.id}" type="number" min="0" max="100" step="1" value="${tgt}"></div>`;}).join('')}<div class="row between"><span class="help">Barra superior: histórico · inferior: meta</span><button class="btn" type="submit">Salvar estratégia</button></div></form>`)}${box(`<h2>Distribuição consolidada</h2><p class="small muted">Representação proporcional dos custos registrados.</p>${donut(D.cats,D.total)}<div class="notice gray" style="margin-top:18px"><b>Para validar a alocação de verdade</b>, você precisará adicionar um relatório de posições ou registrar preços e saldos atuais. Os arquivos enviados só permitem reconstrução aproximada.</div>`)} </div></div>`;}
function ai(D){return `<div class="stack">${box(`<div class="row between"><div><div class="chip" style="width:max-content">✦ Diagnóstico por regras</div><h2 style="margin-top:12px;font-size:20px">Seu plano de análise</h2><p class="small muted">Cruza o histórico de negociações, distribuição escolhida, objetivos e cenário hipotético. Não usa IA generativa nem previsão em tempo real nesta versão.</p></div><span style="font-size:35px;color:#087958">✦</span></div>`)}${caution()}${cardsAnalysis(D,9)}${box(`<div class="section"><h2>Fontes e limitações</h2></div><div class="list"><div class="statrow"><div><b class="small">Arquivos B3</b><div class="desc">Histórico importado</div></div><span class="chip">Disponível</span></div><div class="statrow"><div><b class="small">Metas e objetivos</b><div class="desc">Configuráveis no próprio app</div></div><span class="chip">Disponível</span></div><div class="statrow"><div><b class="small">Cotações e posições atuais</b><div class="desc">Não presentes nos arquivos enviados</div></div><span class="chip amber">Pendente</span></div><div class="statrow"><div><b class="small">Cenários macroeconômicos</b><div class="desc">Hipóteses definidas manualmente</div></div><span class="chip amber">Simulação</span></div></div>`)}</div>`;}
function goals(D){const g=S.goal,estim=D.total+Number(g.monthly||0)*Number(g.months||0),progress=g.amount>0?Math.min(100,D.total/g.amount*100):0;return `<div class="grid wide">${box(`<div class="section"><h2>Seu objetivo</h2><span class="chip">Personalizável</span></div><form id="goal-form" class="stack"><div class="field"><label>Nome da meta</label><input name="name" value="${h(g.name)}" maxlength="100" required></div><div class="formgrid"><div class="field"><label>Valor desejado (R$)</label><input name="amount" type="number" min="1" step="0.01" value="${g.amount}" required></div><div class="field"><label>Prazo (meses)</label><input name="months" type="number" min="1" max="1200" value="${g.months}" required></div><div class="field"><label>Aporte mensal (R$)</label><input name="monthly" type="number" min="0" step="0.01" value="${g.monthly}" required></div><div class="field"><label>Perfil declarado</label><select name="profile"><option value="conservador" ${g.profile==='conservador'?'selected':''}>Conservador</option><option value="moderado" ${g.profile==='moderado'?'selected':''}>Moderado</option><option value="arrojado" ${g.profile==='arrojado'?'selected':''}>Arrojado</option></select></div></div><button type="submit" class="btn">Salvar objetivo</button></form>`)}${box(`<h2>Progresso ilustrativo</h2><div class="goal" style="margin-top:16px"><div class="small muted">Base de custos aproximada</div><div class="large">${money(D.total)}</div><div class="row between" style="margin:15px 0 7px"><span class="small">Alvo: ${money(g.amount)}</span><b class="small">${pcent(progress)}</b></div><div class="progress"><div style="width:${progress}%"></div></div></div><div class="kv"><span>Aportes planejados no período</span><b>${money(Number(g.monthly)*Number(g.months))}</b></div><div class="kv"><span>Custo inicial + aportes</span><b>${money(estim)}</b></div><div class="kv"><span>Diferença contra a meta</span><b>${money(g.amount-estim)}</b></div><div class="notice gray" style="margin-top:13px">Simulação nominal <b>sem rendimentos, impostos, taxas ou inflação</b>. Custo histórico não equivale ao saldo de mercado.</div>`)}</div>`;}
const SCENARIOS=[{id:'high',name:'Juros elevados',text:'Comparar risco de crédito, liquidez e sensibilidade dos preços da renda fixa. Rendimentos futuros não são garantidos.'},{id:'fall',name:'Juros em queda',text:'Estudar duração e marcação a mercado em títulos prefixados e IPCA+, sem supor valorização automática.'},{id:'infl',name:'Inflação persistente',text:'Conferir retornos reais, prazos e proteção inflacionária dos objetivos.'},{id:'fx',name:'Câmbio volátil',text:'Avaliar diversificação internacional, volatilidade em reais e riscos de concentração geográfica.'}];
function scenarios(D){const sc=SCENARIOS.find(x=>x.id===S.scenario)||SCENARIOS[0];return `<div class="grid wide">${box(`<div class="section"><h2>Escolha um cenário hipotético</h2><span class="chip amber">Não é cenário atual</span></div><div class="grid g2">${SCENARIOS.map(s=>`<button class="scenario-box ${S.scenario===s.id?'active':''}" data-scenario="${s.id}"><strong>${s.name}</strong><span>${s.text}</span></button>`).join('')}</div><p class="help" style="margin-top:18px">Nenhum dado macroeconômico é buscado automaticamente. Os cenários são comparativos e ilustrativos.</p>`)}${box(`<h2>Como isso influencia sua análise</h2><div class="goal" style="margin-top:17px"><span class="chip">Cenário selecionado</span><h3 style="font-size:17px;margin:12px 0">${sc.name}</h3><p class="small muted" style="line-height:1.7">${sc.text}</p></div><div class="divider"></div><p class="small muted">O diagnóstico não muda seu objetivo nem executa operações. Utilize o cenário para avaliar riscos, depois valide posições e informações econômicas recentes.</p><button class="btn" data-page="ai">Ver diagnóstico →</button>`)}</div>`;}

function coverageAudit(){
 const trs=S.records.filter(r=>r.t==='trade'),movs=S.records.filter(r=>r.t==='mov');
 const dates=trs.concat(movs).map(r=>dateOf(r)).filter(x=>x!=='0000');
 const first=Math.min(new Date().getFullYear(),...dates.map(s=>Number(s.slice(0,4))));
 const last=new Date().getFullYear();
 const count=(arr,y)=>arr.filter(r=>dateOf(r).slice(0,4)===String(y)).length;
 const mYears=new Set(movs.map(r=>dateOf(r).slice(0,4)));
 const nYears=new Set(trs.map(r=>dateOf(r).slice(0,4)));
 const rows=[];
 for(let y=first;y<=last;y++){
  const a=count(trs,y),b=count(movs,y);
  rows.push(`<tr><td><b>${y}</b></td><td class="num">${nfmt(a,0)}</td><td class="num">${nfmt(b,0)}</td><td>${a===0&&b===0?'<span class="chip amber">Sem registros</span>':!b?'<span class="chip amber">Sem movimentações</span>':!a?'<span class="chip gray">Sem negociações</span>':'<span class="chip">Com registros</span>'}</td></tr>`);
 }
 const missingMov=Array.from({length:last-first+1},(_,i)=>first+i).filter(y=>!mYears.has(String(y)));
 const missingTrade=Array.from({length:last-first+1},(_,i)=>first+i).filter(y=>!nYears.has(String(y)));
 return `<section class="card"><div class="section"><h2>Conferência da cobertura histórica</h2><span class="chip amber">Verificar períodos</span></div><p class="small muted">Tabela montada com as datas dos registros efetivamente importados. Um ano sem lançamentos pode indicar ausência de operações ou um arquivo ainda não enviado; não comprova erro na importação.</p><div class="table-scroll"><table class="data-table"><thead><tr><th>Ano</th><th class="num">Negociações</th><th class="num">Movimentações</th><th>Diagnóstico</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><div class="notice" style="margin-top:15px"><b>A conferir na B3:</b> ${missingTrade.length?'Negociação: '+missingTrade.join(', ')+'. ':''}${missingMov.length?'Movimentação: '+missingMov.join(', ')+'. ':''}${S.positionSnapshot?.rows?.length?'A posição já foi importada: o patrimônio é calculado pelo relatório de Posição, não pela soma de negociações.':'Para atualizar o patrimônio, importe o relatório de Posição B3.'}</div><p class="help">Desdobramentos, bonificações, transferências e incorporação podem alterar quantidades sem aparecerem como compras e vendas; o cálculo atual não reconcilia esses eventos.</p></section>`;
}
function coverageFlag(){
 const tr=S.records.filter(r=>r.t==='trade'),mv=S.records.filter(r=>r.t==='mov');
 if(!tr.length||!mv.length)return '';
 const lastTrade=tr.map(r=>dateOf(r)).sort().at(-1),lastMov=mv.map(r=>dateOf(r)).sort().at(-1);
 if(lastMov>=lastTrade)return '';
 const yr=lastMov.slice(0,4);
 return `<div class="notice"><b>Cobertura incompleta:</b> o último registro de movimentação importado é de ${yr}, enquanto as negociações seguem até ${lastTrade.slice(0,4)}. Rendimentos, dividendos e eventos posteriores podem faltar. <button class="muted-link" data-page="files">Ver anos e importar →</button></div>`;
}
function filesPage(){const sources=Object.entries(S.sources||{}),tCount=groupRecords('trade').length,mCount=groupRecords('mov').length;return `<div class="stack">${S.positionSnapshot?.rows?.length?box(`<div class="section"><h2>Última posição B3</h2><span class="chip">${S.positionSnapshot.rows.length} posições</span></div><div class="kpi"><div class="num">${money(S.positionSnapshot.total)}</div><p class="small muted">${h(S.positionSnapshot.source)} · ${h(S.positionSnapshot.date.split('-').reverse().join('/'))} · não são cotações em tempo real</p></div>`):''}${coverageAudit()}${box(`<div class="section"><h2>Importar arquivos da B3</h2><span class="chip">XLSX · até 20 MB</span></div><div class="uploader" id="drop-zone"><div class="large">⇧</div><h3>Selecione ou arraste suas planilhas</h3><p>Negociação (9 colunas), Movimentação (8 colunas) ou Posição (ETF, fundos e Tesouro). A Posição substitui a fotografia anterior sem duplicar investimentos.</p><button class="btn" data-act="open-import">Selecionar arquivos .xlsx</button></div><div class="notice good" style="margin-top:15px"><b>Deduplicação automática:</b> compara todos os campos do tipo correspondente, inclusive data, instituição, quantidade, preço, valor e ativo. Um registro idêntico já existente não entra novamente.</div>${ui.report?`<div class="sheet-detail" style="margin-top:15px;white-space:pre-wrap">${h(ui.report)}</div>`:''}`)}<div class="grid g2">${box(`<div class="section"><h2>Exportar negociação</h2><span class="chip">${nfmt(tCount,0)} registros</span></div><p class="small muted">Gera Excel com aba <b>Negociação</b> e as mesmas 9 colunas dos arquivos que você enviou, incluindo lançamentos manuais.</p><button class="btn" data-act="export-trade">⇩ Exportar negociação.xlsx</button>`)}${box(`<div class="section"><h2>Exportar movimentação</h2><span class="chip">${nfmt(mCount,0)} registros</span></div><p class="small muted">Gera Excel com aba <b>Movimentação</b> e as mesmas 8 colunas dos arquivos originais, incluindo lançamentos manuais.</p><button class="btn" data-act="export-mov">⇩ Exportar movimentacao.xlsx</button>`)}</div>${box(`<div class="section"><h2>Arquivos incorporados na criação</h2><span class="chip gray">${sources.length} arquivos</span></div><div class="list">${sources.map(([f,v])=>`<div class="statrow"><div style="min-width:0"><div class="name" style="word-break:break-all">${h(f)}</div><div class="desc">${v.type==='position'?'Posição B3':v.type==='trade'?'Negociação':'Movimentação'} · ${v.accepted} incorporados</div></div>${v.skipped?`<span class="chip amber">${v.skipped} repetidos</span>`:'<span class="chip">OK</span>'}</div>`).join('')||'<p class="muted small">Nenhum arquivo listado.</p>'}</div>`)}${box(`<div class="section"><h2>Backup e gerenciamento</h2></div><div class="row wrap"><button class="btn outline" data-act="backup">⇩ Backup completo (.json)</button><button class="btn outline" data-act="import-backup">⇧ Restaurar backup (.json)</button><button class="btn danger" data-act="clear">Apagar registros</button></div><p class="help" style="margin-top:15px">Os Excel exportados seguem o formato de colunas da B3. O JSON salva também o último relatório de Posição, metas e classificações. A sincronização usa sua conta no Supabase, mas recomenda-se guardar backups periódicos.</p>`)} </div>`;}

/* V3: comparativos e fluxo de capital, sem inventar rentabilidade histórica. */
const V3_DAY=86400000;
function v3owner(){return ui.owner||'me';}
function v3history(owner=v3owner()){
  let all=Array.isArray(S.positionHistory)?S.positionHistory.slice():[];
  const add=(o,snap)=>{if(snap?.rows?.length&&!all.some(p=>p.owner===o&&p.date===snap.date))all.push({owner:o,date:snap.date,total:Number(snap.total)||0,source:snap.source});};
  add('me',S.positionSnapshot);add('spouse',S.spousePositionSnapshot);
  all=all.filter(x=>Number.isFinite(+x.total)&&/^\d{4}-\d\d-\d\d$/.test(x.date)).sort((a,b)=>a.date.localeCompare(b.date));
  if(owner!=='family')return all.filter(x=>x.owner===owner);
  const dates=[...new Set(all.map(x=>x.date))].sort();

function v3flows(owner=v3owner(),since='0000'){

function v3profit(D){
 const owner=v3owner(),bases=S.performanceBase||{},balance=S.cashBalances||{};

 };

function v3realized(){
 const trades=groupRecords('trade').slice().sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));
 const cost=new Map(),monthly={};let realized=0,unmatched=0,sales=0;
 for(const r of trades){
  const code=stripFrac(r.v[5]),q=num(r.v[6]),value=num(r.v[8]),act=norm(r.v[1]);
  if(!code||!Number.isFinite(q)||q<=0||!Number.isFinite(value)||value<0)continue;
  const key=(r.owner==='spouse'?'spouse':'me')+'|'+code;
  const t=cost.get(key)||{qty:0,value:0};
  if(act==='COMPRA'){t.qty+=q;t.value+=value;}
  if(act==='VENDA'){
   sales++;
   const covered=Math.min(q,t.qty);
   if(covered>0){
    const basis=t.value/t.qty*covered,profit=value*covered/q-basis;
    realized+=profit;t.qty-=covered;t.value-=basis;
    const month=dateOf(r).slice(0,7);monthly[month]=(monthly[month]||0)+profit;
   }
   if(q>covered)unmatched+=q-covered;
  }
  cost.set(key,t);
 }
 return {realized,unmatched,sales,cost,monthly};
}
function v3unrealized(D){
 const basis=v3realized().cost;let invested=0,unrealized=0,matched=0,missing=0;
 for(const r of D.active){
   const item=basis.get((r.owner==='spouse'?'spouse':'me')+'|'+stripFrac(r.code)),q=Number(r.qty);
   if(!item||!q||item.qty<=0||Math.abs(item.qty-q)>Math.max(.0001,.002*q)){missing++;continue;}
   invested+=Math.max(0,item.value);unrealized+=r.cost-Math.max(0,item.value);matched++;
 }
 return{invested,unrealized,matched,missing,complete:matched>0&&missing===0};
}

function parsePositionSheet(rows){
 if(!rows?.length)return null;
 const head=rows[0].map(x=>norm(x)),idx=x=>head.indexOf(norm(x));
 if(idx('Produto')!==0||idx('Valor Atualizado')<0||idx('Quantidade')<0)return null;
 const group=idx('Vencimento')>=0&&idx('Código ISIN')>=0?'Tesouro Direto':idx('Administrador')>=0?'Fundo de Investimento':'ETF';
 const pick=(r,c)=>idx(c)<0?'':r[idx(c)]??'';
 const items=[],seen=new Set();let ignored=0;
 for(const r of rows.slice(1)){
  const product=txt(r[0]),qty=num(pick(r,'Quantidade')),value=num(pick(r,'Valor Atualizado'));
  if(!/[A-Za-zÀ-ÿ]/.test(product)||!Number.isFinite(qty)||qty<0||!Number.isFinite(value)||value<0){ignored++;continue;}
  const code=txt(pick(r,group==='Tesouro Direto'?'Código ISIN':'Código de Negociação'))||product.split(' - ')[0];
  const key=[group,code,pick(r,'Instituição'),pick(r,'Conta'),qty,value].join('|');
  if(seen.has(key)){ignored++;continue;}seen.add(key);
  items.push({group,product,institution:txt(pick(r,'Instituição')),code,qty,
   price:num(pick(r,'Preço de Fechamento'))||0,value,
   available:num(pick(r,'Quantidade Disponível'))||0,
   maturity:txt(pick(r,'Vencimento')),indexer:txt(pick(r,'Indexador')),
   applied:num(pick(r,'Valor Aplicado'))||0,gross:num(pick(r,'Valor bruto'))||0,net:num(pick(r,'Valor líquido'))||0,
   raw:r.slice(0,head.length)});
 }
 return{group,items,ignored};
}

    const parsed=parsePositionSheet(rows);
    if(parsed){
      recognized=true;for(const p of parsed.items){
       const key=[p.group,p.code,p.institution,p.qty,p.value].join('|');
       if(positionKeys.has(key)){skip++;continue;}
       positionKeys.add(key);positions.push(p);
      }continue;
    }
    let headIndex=-1,kind='';
    for(let i=0;i<Math.min(8,rows.length);i++){
      if(norm(rows[i][0])===norm(NHEAD[0])&&norm(rows[i][5])===norm(NHEAD[5])){kind='trade';headIndex=i;break;}
      if(norm(rows[i][0])===norm(MHEAD[0])&&norm(rows[i][2])===norm(MHEAD[2])){kind='mov';headIndex=i;break;}
    }
    if(headIndex<0)continue;recognized=true;
    for(const r of rows.slice(headIndex+1)){
      if(!r||!r.some(v=>txt(v)))continue;
      const v=canon(kind,r);if(!validRow(kind,v)){bad++;continue;}
      const key=fingerprint(kind,v);if(known.has(key)){skip++;continue;}
      known.add(key);S.records.push({t:kind,v,id:'i'+uid(),source:file.name,owner});added++;
    }
   }
   if(!recognized)throw Error('Formato B3 não identificado (Negociação, Movimentação ou Posição).');
   if(positions.length){
    const total=Math.round(positions.reduce((sum,r)=>sum+r.value,0)*100)/100;
    const snap={date:new Date().toISOString().slice(0,10),source:file.name,rows:positions,total};
    if(owner==='spouse')S.spousePositionSnapshot=snap;else S.positionSnapshot=snap;
    if(!Array.isArray(S.positionHistory))S.positionHistory=[];
    S.positionHistory=S.positionHistory.filter(x=>!(x.owner===owner&&x.date===snap.date));
    S.positionHistory.push({date:snap.date,owner,total,source:file.name});
    S.positionHistory.sort((a,b)=>a.date.localeCompare(b.date));
    S.sources[(owner==='spouse'?'Esposa · ':'Minha · ')+file.name]={type:'position',owner,accepted:positions.length,skipped:skip};
    positionCount+=positions.length;
    details.push(file.name+': posição atualizada — '+positions.length+' itens, '+money(total)+'.');
   }else{
    S.sources[(owner==='spouse'?'Esposa · ':'Minha · ')+file.name]={type:file.name.toLowerCase().includes('movimentacao')?'mov':'trade',owner,accepted:added,skipped:skip};
    details.push(file.name+': '+added+' novos, '+skip+' duplicados, '+bad+' inválidos.');
   }
   count+=added;dups+=skip;invalid+=bad;
  }catch(e){details.push(file.name+': ERRO — '+e.message);}
 }
 if(count||positionCount)save();
 ui.report='Importação: '+count+' novos no histórico; '+positionCount+' posições atualizadas; '+dups+' duplicados ignorados; '+invalid+' inválidos.\n'+details.join('\n');
 if(positionCount)ui.owner=owner;
 page=positionCount?'portfolio':'files';ui.kind='trade';render();
 const lastSnapshot=owner==='spouse'?S.spousePositionSnapshot:S.positionSnapshot;
 toast(positionCount?'Posição atualizada: '+money(lastSnapshot?.total||0):count+' novos, '+dups+' repetidos bloqueados.',!count&&!positionCount);
}
function download(blob,name){const link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportSheet(t){const rows=groupRecords(t).slice().sort((a,b)=>dateOf(b).localeCompare(dateOf(a))).map(r=>r.v);const title=t==='trade'?'Negociação':'Movimentação',file=t==='trade'?'negociacao':'movimentacao';const blob=Excel.create(title,[header(t),...rows]);download(blob,`${file}-moneytracker-${new Date().toISOString().slice(0,10)}.xlsx`);toast(`Exportados ${rows.length} registros de ${title} no formato B3.`);}
function addManual(e){e.preventDefault();const form=e.target,t=ui.modal.t,record=ui.modal.id?S.records.find(r=>r.id===ui.modal.id):null;const data=new FormData(form);let row=header(t).map((_,i)=>data.get('f'+i));const dt=t==='trade'?0:1;row[dt]=dbr(row[dt]);row=canon(t,row);if(!validRow(t,row)){toast('Preencha data, ativo/produto, instituição e os campos obrigatórios.',true);return;}
  const owner=record?.owner||ui.owner||'me';if(owner==='family'){toast('Selecione Minha ou Esposa para lançar.',true);return;}const key=fingerprint(t,row),found=S.records.find(r=>r.id!==record?.id&&(r.owner||'me')===owner&&fingerprint(r.t,r.v)===key);if(found){toast('Registro duplicado: já existe uma linha com os mesmos dados. Nada foi inserido.',true);return;}
  if(record){record.v=row;record.source='Editado no aplicativo';}else S.records.push({t,v:row,id:'m'+uid(),source:'Lançamento manual',owner});
  save();ui.modal=null;$('.modal-bg')?.remove();page='records';ui.kind=t;render();toast(record?'Registro atualizado.':'Registro manual adicionado.');}
function backup(){download(new Blob([JSON.stringify({format:'moneytracker-backup',date:new Date().toISOString(),data:S},null,2)],{type:'application/json'}),'moneytracker-backup-'+new Date().toISOString().slice(0,10)+'.json');}
async function restoreBackup(file){try{const obj=JSON.parse(await file.text());if(obj.format!=='moneytracker-backup'||obj.data?.v!==3||!Array.isArray(obj.data.records))throw Error('Backup não reconhecido.');
    const records=[],seen=new Set();for(const r of obj.data.records){if(!['trade','mov'].includes(r.t))continue;const v=canon(r.t,r.v);if(!validRow(r.t,v))continue;const f=fingerprint(r.t,v);if(seen.has(f))continue;seen.add(f);records.push({...r,v,id:String(r.id||uid())});}
    if(!confirm(`Substituir seus ${S.records.length} registros pelos ${records.length} do backup? Faça um backup antes, se necessário.`))return;
    S={...original(),...obj.data,records,targets:{...TARGET,...obj.data.targets},goal:{...DEFAULT_GOAL,...obj.data.goal}};save();page='home';render();toast('Backup restaurado, sem registros repetidos.');}catch(e){toast('Falha ao restaurar backup: '+e.message,true);}}
function dispatch(e){
  const ownerClick=e.target.closest('[data-owner]');if(ownerClick){ui.owner=ownerClick.dataset.owner;ui.portfolioFilter='';ui.search='';render();return;}
  const deleteFlow=e.target.closest('[data-v3-delete-flow]');
  if(deleteFlow){const id=deleteFlow.dataset.v3DeleteFlow;if(confirm('Excluir este movimento de dinheiro?')){S.cashflows=(S.cashflows||[]).filter(x=>x.id!==id);save();ui.benchmark='';render();toast('Movimento excluído.');}return;}
  const quoteBtn=e.target.closest('[data-v3-fetch-quote]');if(quoteBtn){v3fetchQuote(quoteBtn.dataset.v3FetchQuote);return;}
  const asset=e.target.closest('[data-asset]');if(asset){ui.selectedAsset=asset.dataset.asset;ui.selectedAssetOwner=asset.dataset.assetOwner;page='asset';window.scrollTo(0,0);render();return;}
  const cat=e.target.closest('[data-v2-filter]');if(cat){ui.portfolioFilter=cat.dataset.v2Filter;ui.pageLimit=80;render();return;}
  const yr=e.target.closest('[data-income-year]');if(yr){ui.incomeYear=yr.dataset.incomeYear;render();return;}
  const back=e.target.closest('[data-act="v2-back"]');if(back){page=page==='asset'?'portfolio':'more';render();return;}
  const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;ui.search='';ui.pageLimit=80;window.scrollTo(0,0);render();return;}
  const kind=e.target.closest('[data-kind]');if(kind){ui.kind=kind.dataset.kind;ui.search='';ui.pageLimit=80;render();return;}
  const sc=e.target.closest('[data-scenario]');if(sc){S.scenario=sc.dataset.scenario;save();render();return;}
  const edit=e.target.closest('[data-edit]');if(edit){const r=S.records.find(x=>x.id===edit.dataset.edit);if(r){ui.modal={t:r.t,id:r.id};renderModal();}return;}
  const del=e.target.closest('[data-delete]');if(del){const r=S.records.find(x=>x.id===del.dataset.delete);if(r&&confirm('Excluir definitivamente este registro?')){S.records=S.records.filter(x=>x.id!==r.id);save();render();toast('Registro excluído.');}return;}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='v3-benchmark'){v3benchmarks();return;}
  if(act==='open-import'){ui.importOwner=ui.owner==='spouse'?'spouse':ui.importOwner||'me';page='files';window.scrollTo(0,0);render();return;}if(act==='add-trade'||act==='add-mov'){ui.modal={t:act==='add-mov'?'mov':'trade'};renderModal();return;}
  if(act==='close-modal'){ui.modal=null;$('.modal-bg')?.remove();return;}
  if(act==='show-more'){ui.pageLimit+=80;render();return;}
  if(act==='export-trade'||act==='export-mov'){exportSheet(act==='export-trade'?'trade':'mov');return;}
  if(act==='backup'){backup();return;}if(act==='import-backup'){$('#backup-input').click();return;}
  if(act==='clear'){if(confirm('Apagar todos os registros do MoneyTracker neste navegador? Esta ação não pode ser desfeita sem backup.')&&confirm('Confirma que deseja excluir TODOS os seus registros?')){S.records=[];S.sources={};save();render();toast('Base esvaziada.');}return;}
}
document.addEventListener('click',dispatch);
document.addEventListener('submit',e=>{
  if(e.target.id==='v3-base-form'){
    e.preventDefault();if(ui.owner==='family')return;
    const d=new FormData(e.target),date=String(d.get('date')),amount=Number(d.get('amount')),cash=Number(d.get('cash'));
    if(!/^\d{4}-\d\d-\d\d$/.test(date)||date>new Date().toISOString().slice(0,10)||!Number.isFinite(amount)||amount<0||!Number.isFinite(cash)||cash<0||!d.get('confirmed')){toast('Confira os valores, a data e a confirmação dos aportes.',true);return;}
    const snap=ui.owner==='spouse'?S.spousePositionSnapshot:S.positionSnapshot;
    if(snap?.date&&date>snap.date){toast('A data inicial deve ser anterior ou igual à data da posição B3.',true);return;}
    if(!S.performanceBase)S.performanceBase={};if(!S.cashBalances)S.cashBalances={};
    S.performanceBase[ui.owner]={date,amount,confirmed:true};S.cashBalances[ui.owner]=cash;
    ui.benchmark='';save();render();toast('Ponto de partida salvo.');return;
  }
  if(e.target.id==='v3-flow-form'){
    e.preventDefault();if(ui.owner==='family')return;
    const d=new FormData(e.target),type=String(d.get('type')),date=String(d.get('date')),amount=Number(d.get('amount'));
    if(!['deposit','withdraw','transfer'].includes(type)||!/^\d{4}-\d\d-\d\d$/.test(date)||date>new Date().toISOString().slice(0,10)||!Number.isFinite(amount)||amount<=0){toast('Informe um movimento válido.',true);return;}
    if(!Array.isArray(S.cashflows))S.cashflows=[];
    const toOwner=type==='transfer'&&d.get('toOwner')==='spouse'?'spouse':type==='transfer'&&d.get('toOwner')==='me'?'me':ui.owner;
    S.cashflows.push({id:uid(),owner:ui.owner,toOwner,type,date,amount,from:txt(d.get('from')).slice(0,80),to:txt(d.get('to')).slice(0,80)});
    ui.benchmark='';save();render();toast('Movimento registrado.');return;
  }
  if(e.target.id==='v3-quote-form'){
    e.preventDefault();const d=new FormData(e.target),symbol=String(d.get('symbol')||''),price=Number(d.get('price'));
    if(!/^[A-Z0-9]{4,15}$/.test(symbol)||!Number.isFinite(price)||price<=0){toast('Código ou preço inválido.',true);return;}
    if(!S.quotes||typeof S.quotes!=='object')S.quotes={};
    S.quotes[symbol]={price,at:new Date().toISOString(),provider:'Informado manualmente'};
    save();render();toast('Cotação manual salva.');return;
  }
  if(e.target.id==='record-form'){addManual(e);return;}
  if(e.target.id==='target-form'){e.preventDefault();const d=new FormData(e.target),t={};for(const c of CATS)t[c.id]=Number(d.get(c.id)||0);const tot=Object.values(t).reduce((a,b)=>a+b,0);if(Math.abs(tot-100)>.01){toast('A distribuição precisa somar exatamente 100%. Soma atual: '+nfmt(tot,1)+'%.',true);return;}S.targets=t;save();render();toast('Distribuição-alvo atualizada.');return;}
  if(e.target.id==='goal-form'){e.preventDefault();const d=new FormData(e.target);S.goal={name:txt(d.get('name')),amount:Number(d.get('amount')),months:Number(d.get('months')),monthly:Number(d.get('monthly')),profile:txt(d.get('profile'))};save();render();toast('Objetivo atualizado.');return;}
});
document.addEventListener('change',e=>{if(e.target.matches('#v2-import-owner')){ui.importOwner=e.target.value;return;}if(e.target.matches('#pf')){ui.portfolioFilter=e.target.value;render();}if(e.target.matches('[data-class]')){S.classes[e.target.dataset.class]=e.target.value;save();render();toast('Classificação do ativo ajustada.');}});
document.addEventListener('input',e=>{if(e.target.matches('#search')){const val=e.target.value,sel=e.target.selectionStart;ui.search=val;render();const field=$('#search');field?.focus();field?.setSelectionRange(sel,sel);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;$('.modal-bg')?.remove();}});
document.addEventListener('change',async e=>{if(e.target?.id==='v2-file-input'){const selected=Array.from(e.target.files||[]);if(selected.length){ui.report='Importando '+selected.length+' arquivo(s)…';const status=document.createElement('div');status.className='v2callout';status.setAttribute('role','status');status.textContent=ui.report; e.target.closest('.v2panel')?.appendChild(status);try{await importExcel(selected);}catch(err){ui.report='Falha na importação: '+(err?.message||err);page='files';render();toast(ui.report,true);}}if(e.target.isConnected)e.target.value='';}});
$('#file-input').addEventListener('change',async e=>{if(e.target.files.length)await importExcel(e.target.files);e.target.value='';});
$('#backup-input').addEventListener('change',async e=>{if(e.target.files.length)await restoreBackup(e.target.files[0]);e.target.value='';});
document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files')){e.preventDefault();$('#drop-zone')?.classList.add('drag');}});
document.addEventListener('dragleave',e=>{$('#drop-zone')?.classList.remove('drag');});
document.addEventListener('drop',async e=>{if(e.dataTransfer?.files?.length){e.preventDefault();$('#drop-zone')?.classList.remove('drag');await importExcel(e.dataTransfer.files);}});
render();
window.MoneyTrackerBridge={getState:()=>S,setState:(obj)=>{if(!obj||obj.v!==3||!Array.isArray(obj.records))throw new Error("Formato inválido de dados");S=obj;render();},reset:()=>{S=original();render();}};
window.__MONEYTRACKER_TEST__={Excel,S,activity,fingerprint,canon,validRow,importExcel,exportSheet,render,go:(p)=>{page=p;render();}};
