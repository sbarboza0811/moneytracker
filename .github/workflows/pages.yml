name: Deploy MoneyTracker to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-recovery-20261104-v271
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate financial calculation cascade
        run: |
          node --check engine-v7.js
          node --check reconciliation-v7.js
          node --check calculation-v1.js
          node --check app-v8.js
          node --check cloud-v7.js
          node tests/calculation-smoke.test.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
