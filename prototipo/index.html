function allocation(){const grps=[['Renda fixa','#103c32'],['ETFs','#19a37b'],['FIIs','#86cdb7']];let acc=0;const sections=grps.map(([name,color])=>{let a=acc;acc+=sumGroup(name)/total()*100;return `${color} ${a}% ${acc}%`}).join(',');return card(`<div class="sectionhead" style="margin-top:0"><h2>Distribuição</h2><button class="textlink" data-go="carteira">Ver ativos ›</button></div><div class="allocation"><div class="donut" style="background:conic-gradient(${sections})"><div class="donut-inner"><div><span class="tiny muted">Classes</span><strong>3</strong></div></div></div><div class="legend">${grps.map(([g,color])=>`<div class="legend-item"><span><i class="dot" style="background:${color}"></i>${g}</span><b>${pct(sumGroup(g)/total()*100)}</b></div>`).join('')}</div></div>`) }
function item(row){return `<button class="asset" data-asset="${esc(row.symbol)}"><span class="monogram">${esc(row.symbol.slice(0,2))}</span><span class="asset-body"><div class="asset-title">${esc(row.symbol)}</div><div class="asset-sub">${esc(row.name)}</div></span><span><div class="asset-value num">${brl(row.value)}</div><div class="asset-part">${pct(row.value/total()*100)}</div></span></button>`}
function inicio(){const top=[...DATA].sort((a,b)=>b.value-a.value).slice(0,4);return heading('Tudo em um só lugar','Seu patrimônio com menos distrações.','Seu dinheiro, com clareza')+`<div class="page-columns"><div><div class="grid">${hero()}</div><div class="sectionhead"><h2>Acesso rápido</h2></div><div class="actions">${iconCard('i-upload','Importar B3','importar')}${iconCard('i-plus','Novo lançamento','novo')}${iconCard('i-target','Simular aporte','simular')}</div><div class="sectionhead"><h2>Resumo da carteira</h2></div><div class="grid kpis">${[['Renda fixa',sumGroup('Renda fixa'),'Investimento conservador'],['ETFs',sumGroup('ETFs'),'Bolsa e exterior'],['FIIs',sumGroup('FIIs'),'Fundos imobiliários'],['Objetivo',state.goal,'Meta de patrimônio']].map(([title,value,note])=>card(`<div class="kpi-title">${title}</div><div class="kpi-value num">${brl(value)}</div><div class="kpi-foot">${note}</div>`)).join('')}</div></div><div><div class="sectionhead"><h2>Principais ativos</h2><button class="textlink" data-go="carteira">Ver todos ›</button></div>${card(`<div class="list">${top.map(item).join('')}</div>`)}<div class="sectionhead"><h2>Composição</h2></div>${allocation()}</div></div>`}
function carteira(){let rows=DATA.filter(r=>(state.group==='Todos'||r.group===state.group)&&(`${r.symbol} ${r.name}`.toLowerCase().includes(state.search.toLowerCase())));rows.sort(state.sort==='name'?(a,b)=>a.symbol.localeCompare(b.symbol):(a,b)=>b.value-a.value);return heading('Sua carteira','Encontre qualquer ativo rapidamente.','Investimentos')+`${card(`<div class="flex"><div><div class="tiny muted">Total investido</div><h1 style="font-size:26px;margin:6px 0">${brl(total())}</h1></div><span class="pill">${DATA.length} posições</span></div><div class="tip">Valores demonstrativos de uma posição B3 fictícia.</div>`)}<div class="sectionhead"><h2>Seus ativos</h2><select class="select" id="sort"><option value="value" ${state.sort==='value'?'selected':''}>Maior valor</option><option value="name" ${state.sort==='name'?'selected':''}>A–Z</option></select></div><div class="searchwrap">${ic('i-search')}<input id="q" placeholder="Buscar ativo ou fundo" value="${esc(state.search)}" aria-label="Buscar ativo"></div><div class="filters">${['Todos','Renda fixa','ETFs','FIIs'].map(g=>`<button class="filter ${state.group===g?'on':''}" data-group="${g}">${g}</button>`).join('')}</div><div class="topgap">${card(`<div class="list" id="assets-list">${rows.length?rows.map(item).join(''):'<div class="empty">Nenhum ativo encontrado.</div>'}</div>`)}</div><div class="sectionhead"><h2>Distribuição da carteira</h2></div>${allocation()}`}
function proventos(){let max=Math.max(...SERIES),income=SERIES.reduce((a,b)=>a+b,0);return heading('Proventos','Rendimentos sem tabelas intermináveis.','Renda passiva')+`<section class="hero"><div class="hero-label">Recebido nos últimos 12 meses</div><div class="hero-amount">${brl(income)}</div><div class="hero-label">Valores simulados para demonstrar a nova interface</div><div class="hero-bottom"><span class="hero-pill">Média ${brl(income/12)}/mês</span></div></section><div class="sectionhead"><h2>Evolução mensal</h2><select id="incomePeriod" class="select"><option>12 meses</option><option>2026</option></select></div>${card(`<div class="monthbars">${SERIES.map((v,i)=>`<div class="barcol"><span class="bar ${i===SERIES.length-1?'on':''}" style="height:${Math.max(4,v/max*116)}px" title="${brl(v)}"></span><small>${['Nov','Dez','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out'][i]}</small></div>`).join('')}</div>`)}<div class="sectionhead"><h2>Últimos pagamentos</h2><span class="pill gray">Demonstração</span></div>${card(`<div class="list">${payments.map(p=>`<div class="receipt"><span class="monogram">${p.symbol.slice(0,2)}</span><div><strong>${p.symbol}</strong><div class="date">${p.date}</div></div><span class="value num">+ ${brl(p.val)}</span></div>`).join('')}</div>`)}<div class="sectionhead"><h2>Novas funções</h2></div>${card(`<div class="rule"><span class="rule-icon">↻</span><div><div class="title">Calendário de proventos</div><p class="desc">Concentrar datas e históricos de rendimentos.</p></div></div><div class="rule"><span class="rule-icon">↗</span><div><div class="title">Evolução da renda</div><p class="desc">Comparar meses e identificar crescimento, sem misturar aporte com rendimento.</p></div></div>`)}`}
function simulation(){const val=total(),ap=state.monthly,annual=.08,rate=Math.pow(1+annual,1/12)-1,m=state.years*12;let amount=val*Math.pow(1+rate,m)+ap*(Math.pow(1+rate,m)-1)/rate;return amount}
function analises(){const goalProgress=Math.min(100,total()/state.goal*100);return heading('Seu próximo passo','Decisões mais claras, com números.','Planejamento')+`<div class="tabline"><button class="tab ${state.tab==='objetivos'?'on':''}" data-tab="objetivos">Objetivos</button><button class="tab ${state.tab==='aportes'?'on':''}" data-tab="aportes">Simulador</button><button class="tab ${state.tab==='alertas'?'on':''}" data-tab="alertas">Alertas</button></div><div id="analysis-pane">${analysisPane()}</div>`}
function analysisPane(){if(state.tab==='objetivos'){let p=Math.min(100,total()/state.goal*100);return `${card(`<div class="flex"><h2>Meu patrimônio</h2><span class="pill">${pct(p)} atingido</span></div><div class="goalhero topgap"><div class="small muted">Meta configurada</div><div class="number">${brl(state.goal)}</div><div class="linebar"><div style="width:${p}%"></div></div><div class="flex"><span class="small muted">Atual ${brl(total())}</span><strong class="small">Faltam ${brl(Math.max(0,state.goal-total()))}</strong></div></div><div class="spacer"></div><div class="field"><label for="goal">Alterar meta (R$)</label><input id="goal" class="input" inputmode="decimal" type="number" min="1" step="1000" value="${state.goal}"></div><div class="spacer"></div><button class="btn block" data-tab="aportes">Simular como alcançar</button>`)}`}
if(state.tab==='aportes'){return `${card(`<h2>Simulador de aportes</h2><p class="small muted topgap">Projeção hipotética — não é rendimento garantido.</p><div class="rangebox topgap"><div class="rangepair"><label for="monthly" class="small muted">Aporte mensal</label><strong id="monthly-val">${brl(state.monthly)}</strong></div><input id="monthly" type="range" class="range" min="0" max="10000" step="250" value="${state.monthly}"><div class="rangepair"><label for="years" class="small muted">Prazo</label><strong id="years-val">${state.years} anos</strong></div><input id="years" type="range" class="range" min="1" max="20" step="1" value="${state.years}"><div class="summary"><div><div class="small muted">Patrimônio projetado</div><strong id="simResult">${brl(simulation())}</strong></div><span class="pill">8% a.a. hipotéticos</span></div></div><p class="tip">Parte do patrimônio fictício de ${brl(total())}. Simulação com juros compostos mensais.</p>`)}`}
return card(`<h2>Insights da carteira</h2><p class="small muted topgap">Sugestões por regras, não por inteligência artificial conectada a cotações.</p><div class="rule"><span class="rule-icon">!</span><div><div class="title">Concentração em renda fixa</div><p class="desc">${pct(sumGroup('Renda fixa')/total()*100)} dos ativos demonstrativos estão nessa classe. Compare com sua meta.</p></div></div><div class="rule"><span class="rule-icon">↗</span><div><div class="title">Próximo aporte</div><p class="desc">Simule o efeito de investir mais antes de decidir como distribuir.</p><button class="linkbtn" data-tab="aportes">Simular agora ›</button></div></div><div class="rule"><span class="rule-icon">✓</span><div><div class="title">Dados consistentes</div><p class="desc">O histórico importado e o patrimônio da posição devem ser apresentados separadamente.</p></div></div>`)}
function mais(){return heading('Ferramentas','Tudo que é importante, sem poluir a tela inicial.','Conta e dados')+`${card(`<div class="setting"><div><h3>Importar arquivos da B3</h3><p>Negociação, movimentação e posição</p></div><button data-action="importar">Abrir ›</button></div><div class="setting"><div><h3>Novo lançamento</h3><p>Registrar operação manual</p></div><button data-action="novo">Abrir ›</button></div><div class="setting"><div><h3>Exportar histórico</h3><p>Formatos B3 no aplicativo atual</p></div><button data-action="exportar">Ver ›</button></div><div class="setting"><div><h3>Configurações e conta</h3><p>Segurança, backup e sincronização</p></div><button data-action="conta">Ver ›</button></div>`)}<div class="sectionhead"><h2>Ideias para próximas versões</h2></div>${card(`<div class="rule"><span class="rule-icon">1</span><div><div class="title">Conciliação de posições</div><p class="desc">Comparar quantidade B3 × operações do histórico e explicar diferenças.</p></div></div><div class="rule"><span class="rule-icon">2</span><div><div class="title">Rebalanceamento inteligente</div><p class="desc">Simular novo aporte sem precisar vender ativos.</p></div></div><div class="rule"><span class="rule-icon">3</span><div><div class="title">Linha do tempo</div><p class="desc">Distinguir patrimônio, aportes e proventos por mês.</p></div></div>`)}<div class="notice topgap">Este é um protótipo separado. Sua conta, seus arquivos e os investimentos do MoneyTracker online não são alterados.</div>`}
function render(){const nav=navs.map(([id,icon,label])=>`<button class="navbtn ${state.page===id?'active':''}" data-go="${id}" aria-current="${state.page===id?'page':'false'}">${ic(icon)}<span>${label}</span></button>`).join('');$('#mobile-nav').innerHTML=nav;$('#desk-nav').innerHTML=nav;$('#pages').innerHTML=`<section class="page active">${({inicio,carteira,proventos,analises,mais})[state.page]()}</section>`;window.scrollTo({top:0,behavior:'instant'})}
function go(to){state.page=to;render()}
function modal(content){const root=$('#modal-root');root.hidden=false;root.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-top"><h2>MoneyTracker</h2><button class="close" data-close aria-label="Fechar">×</button></div>${content}</div>`}
function close(){const root=$('#modal-root');root.hidden=true;root.innerHTML=''}
function assetDetail(symbol){const r=DATA.find(x=>x.symbol===symbol);if(!r)return;modal(`<div class="flex"><div><span class="pill gray">${esc(r.group)}</span><h1 style="margin:10px 0">${esc(r.symbol)}</h1><p class="muted small">${esc(r.name)}</p></div><div class="monogram" style="height:54px;width:54px;font-size:16px">${esc(r.symbol.slice(0,2))}</div></div><div class="spacer"></div><section class="goalhero"><div class="small muted">Valor da posição</div><div class="number">${brl(r.value)}</div><div class="flex small"><span>${pct(r.value/total()*100)} da carteira</span><b>${r.qty.toLocaleString('pt-BR')} unidades</b></div></section><div class="spacer"></div><div class="statrow"><span class="label">Classe</span><strong>${r.group}</strong></div><div class="statrow"><span class="label">Valor por unidade (estimado)</span><strong>${brl(r.value/r.qty)}</strong></div><div class="spacer"></div><button class="btn block" data-close>Concluir</button><p class="tip">Informações fictícias apenas para demonstrar a experiência.</p>`)}
function importModal(){modal(`<h2>Importar B3</h2><p class="small muted topgap">Três tipos de arquivo em um só lugar.</p><div class="stack topgap"><div class="rule"><span class="rule-icon">1</span><div><div class="title">Negociação</div><div class="desc">Compras e vendas do histórico</div></div></div><div class="rule"><span class="rule-icon">2</span><div><div class="title">Movimentação</div><div class="desc">Dividendos, juros e outros eventos</div></div></div><div class="rule"><span class="rule-icon">3</span><div><div class="title">Posição</div><div class="desc">Valor e quantidade atualizados pelo relatório</div></div></div></div><div class="spacer"></div><label for="upload-demo" class="btn block" style="display:block;text-align:center">Selecionar Excel para prévia</label><input class="hiddenfile" id="upload-demo" type="file" accept=".xlsx" multiple><div id="chosen" class="filelist topgap"></div><p class="tip">O protótipo só mostra os nomes dos arquivos selecionados. Não interpreta nem envia dados; use o aplicativo atual para importar de verdade.</p><div class="spacer"></div><a class="btn light block" style="display:block;text-align:center;text-decoration:none" href="https://sbarboza0811.github.io/moneytracker/" target="_blank" rel="noopener">Abrir app atual para importar ↗</a>`)}
function newEntry(){modal(`<h2>Novo lançamento</h2><p class="small muted topgap">Fluxo simplificado para futura implementação</p><form id="entry-form" class="stack topgap"><div class="field"><label>Tipo</label><select class="input" name="type"><option>Compra</option><option>Venda</option><option>Dividendo</option><option>Rendimento</option></select></div><div class="two grid"><div class="field"><label>Ativo</label><input name="ticker" class="input" placeholder="Ex.: DIVO11" required maxlength="18"></div><div class="field"><label>Data</label><input name="date" type="date" class="input" required value="2026-10-31"></div></div><div class="two grid"><div class="field"><label>Quantidade</label><input name="qty" class="input" type="number" step="any" min="0.00001" value="1" required></div><div class="field"><label>Valor total (R$)</label><input name="value" class="input" type="number" step="0.01" min="0" required></div></div><button class="btn block" type="submit">Conferir lançamento</button></form><div id="entry-msg" class="topgap small"></div><p class="tip">Protótipo: esta ação não grava operações na sua carteira.</p>`)}
function settingsModal(type){modal(`<h2>${type==='exportar'?'Exportar histórico':'Conta e sincronização'}</h2><div class="notice topgap">Esta área mostra a organização proposta. Na versão definitiva, serão mantidos login, backup, exportação no formato original da B3 e prevenção de duplicados.</div><div class="spacer"></div><button class="btn block" data-close>Entendi</button>`)}
function notify(){modal(`<h2>Central de avisos</h2><div class="rule"><span class="rule-icon">✓</span><div><div class="title">Sem alertas urgentes</div><div class="desc">Nenhum aviso flutuante sobre a navegação.</div></div></div><div class="rule"><span class="rule-icon">i</span><div><div class="title">Dados de demonstração</div><div class="desc">O protótipo não está conectado ao Supabase.</div></div></div>`)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return}if(e.target.closest('#bell')){notify();return}if(e.target.closest('[data-close]')||e.target.id==='modal-root'){close();return}const act=e.target.closest('[data-action]');if(act){const which=act.dataset.action;if(which==='importar')importModal();else if(which==='novo')newEntry();else if(which==='simular'){state.tab='aportes';go('analises')}else settingsModal(which);return}const asset=e.target.closest('[data-asset]');if(asset){assetDetail(asset.dataset.asset);return}const group=e.target.closest('[data-group]');if(group){state.group=group.dataset.group;render();return}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;$('#analysis-pane').innerHTML=analysisPane();all('[data-tab].tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));return}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;render()}if(e.target.id==='goal'){state.goal=Math.max(1,Number(e.target.value)||300000);$('#analysis-pane').innerHTML=analysisPane()}if(e.target.id==='upload-demo'){const files=[...e.target.files||[]];const el=$('#chosen');el.innerHTML=files.length?files.map(f=>`<div class="fileitem">${esc(f.name)} · ${(f.size/1024).toFixed(1)} KB</div>`).join(''):'Nenhum arquivo selecionado.';}});
document.addEventListener('input',e=>{if(e.target.id==='q'){const sel=e.target.selectionStart;state.search=e.target.value;const rows=DATA.filter(r=>(state.group==='Todos'||r.group===state.group)&&(`${r.symbol} ${r.name}`.toLowerCase().includes(state.search.toLowerCase()))).sort(state.sort==='name'?(a,b)=>a.symbol.localeCompare(b.symbol):(a,b)=>b.value-a.value);$('#assets-list').innerHTML=rows.length?rows.map(item).join(''):'<div class="empty">Nenhum ativo encontrado.</div>';return}if(e.target.id==='monthly'||e.target.id==='years'){state.monthly=Number($('#monthly').value);state.years=Number($('#years').value);$('#monthly-val').textContent=brl(state.monthly);$('#years-val').textContent=state.years+' anos';$('#simResult').textContent=brl(simulation())}});
document.addEventListener('submit',e=>{if(e.target.id!=='entry-form')return;e.preventDefault();const d=new FormData(e.target);$('#entry-msg').innerHTML=`<div class="notice"><b>Prévia:</b> ${esc(d.get('type'))} de ${esc(d.get('ticker').toUpperCase())}, ${esc(d.get('qty'))} un. em ${esc(d.get('date'))}, total ${brl(Number(d.get('value')))}. Nada foi gravado.</div>`});
render();
})();
</script>
</body></html>
